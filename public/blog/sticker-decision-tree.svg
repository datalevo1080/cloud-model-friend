<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img" aria-labelledby="t d"><title id="t">Decision tree: turning a GIF into a sticker</title><desc id="d">Start with a GIF. If it does not need to move, make a static sticker: one frame as PNG or WebP with one side exactly 512 pixels. If it must move, ask whether it can be rebuilt as vectors. If yes, build an animated TGS sticker: 512 by 512, at most 3 seconds, at most 64 KB, 60 frames per second. If no, make a video sticker: WebM VP9, one side 512 pixels, at most 3 seconds, at most 256 KB, no audio. Discord shortcut: a GIF under 512 KiB can already be a guild sticker. Dead ends: uploading a GIF to Telegram, and converting GIF pixels into TGS vectors.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a4a63"/></marker></defs>
<rect width="960" height="800" rx="24" fill="#f6f6fb"/>
<text x="40" y="52" font-family="sans-serif" font-size="26" font-weight="700" fill="#1b1b2f">GIF to sticker: which path?</text>
<rect x="330" y="80" width="300" height="56" rx="12" fill="#5b4cf0"/><text x="480" y="117" font-family="sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">You have a GIF</text>
<line x1="480" y1="136" x2="480" y2="158" stroke="#4a4a63" stroke-width="2" marker-end="url(#arr)"/>
<rect x="280" y="160" width="400" height="64" rx="12" fill="#e9e7ff"/><text x="480" y="200" font-family="sans-serif" font-size="22" font-weight="700" fill="#1b1b2f" text-anchor="middle">Does it need to move?</text>
<path d="M 280 192 H 240 V 278" fill="none" stroke="#4a4a63" stroke-width="2" marker-end="url(#arr)"/><text x="258" y="182" font-family="sans-serif" font-size="18" font-weight="700" fill="#1b1b2f" text-anchor="middle">No</text>
<path d="M 680 192 H 720 V 278" fill="none" stroke="#4a4a63" stroke-width="2" marker-end="url(#arr)"/><text x="702" y="182" font-family="sans-serif" font-size="18" font-weight="700" fill="#1b1b2f" text-anchor="middle">Yes</text>
<rect x="40" y="280" width="400" height="110" rx="12" fill="#ffffff" stroke="#e0e0f0"/><text x="64" y="318" font-family="sans-serif" font-size="20" font-weight="700" fill="#1b1b2f">Static sticker</text><text x="64" y="348" font-family="sans-serif" font-size="17" fill="#4a4a63">One frame as PNG or WebP</text><text x="64" y="374" font-family="sans-serif" font-size="17" fill="#4a4a63">One side exactly 512 px</text>
<rect x="520" y="280" width="400" height="64" rx="12" fill="#e9e7ff"/><text x="720" y="319" font-family="sans-serif" font-size="20" font-weight="700" fill="#1b1b2f" text-anchor="middle">Can it be rebuilt as vectors?</text>
<line x1="720" y1="344" x2="720" y2="388" stroke="#4a4a63" stroke-width="2" marker-end="url(#arr)"/><text x="740" y="372" font-family="sans-serif" font-size="18" font-weight="700" fill="#1b1b2f">No</text>
<path d="M 920 312 H 940 V 580 H 922" fill="none" stroke="#4a4a63" stroke-width="2" marker-end="url(#arr)"/><text x="930" y="300" font-family="sans-serif" font-size="18" font-weight="700" fill="#1b1b2f" text-anchor="middle">Yes</text>
<rect x="520" y="390" width="400" height="110" rx="12" fill="#ffffff" stroke="#e0e0f0"/><text x="544" y="428" font-family="sans-serif" font-size="20" font-weight="700" fill="#1b1b2f">Video sticker (WebM)</text><text x="544" y="458" font-family="sans-serif" font-size="17" fill="#4a4a63">VP9, no audio, one side 512 px</text><text x="544" y="484" font-family="sans-serif" font-size="17" fill="#4a4a63">At most 3 s, at most 256 KB</text>
<rect x="520" y="520" width="400" height="110" rx="12" fill="#ffffff" stroke="#e0e0f0"/><text x="544" y="558" font-family="sans-serif" font-size="20" font-weight="700" fill="#1b1b2f">Animated sticker (.TGS)</text><text x="544" y="588" font-family="sans-serif" font-size="17" fill="#4a4a63">Vector rebuild, 512 by 512 px</text><text x="544" y="614" font-family="sans-serif" font-size="17" fill="#4a4a63">At most 3 s, 64 KB, 60 fps</text>
<rect x="40" y="660" width="880" height="56" rx="12" fill="#eef6ee"/><text x="480" y="696" font-family="sans-serif" font-size="18" fill="#2f5d33" text-anchor="middle">Discord shortcut: a GIF under 512 KiB can already be a guild sticker</text>
<rect x="40" y="732" width="880" height="48" rx="12" fill="#fdf0f0"/><text x="480" y="763" font-family="sans-serif" font-size="17" fill="#9b2c2c" text-anchor="middle">Dead ends: uploading a .gif to Telegram · converting GIF pixels into .TGS vectors</text>
</svg>
