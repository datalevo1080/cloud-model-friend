<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">PNG, APNG and GIF compared</title><desc id="d">PNG holds one still image with full colour and full alpha transparency. APNG holds many frames with full colour and soft alpha transparency. GIF holds many frames with at most 256 colours per frame and on-or-off transparency.</desc>
<rect width="960" height="460" rx="24" fill="#f6f6fb"/>
<g font-family="sans-serif">
<text x="40" y="52" font-family="sans-serif" font-size="24" font-weight="700" fill="#1b1b2f">One still, or many frames — and what each frame can hold</text>
<g><rect x="40" y="80" width="280" height="300" rx="16" fill="#fff" stroke="#d8d5ef" stroke-width="2"/><rect x="105" y="112" width="150" height="110" rx="10" fill="#5b4cf0"/><circle cx="180" cy="167" r="30" fill="#fff"/><text x="180" y="252" text-anchor="middle" font-size="20" font-weight="700" fill="#1b1b2f">PNG</text><text x="180" y="282" text-anchor="middle" font-size="16" fill="#4a4a63">1 still image</text><text x="180" y="308" text-anchor="middle" font-size="16" fill="#4a4a63">Full colour</text><text x="180" y="334" text-anchor="middle" font-size="16" fill="#4a4a63">Full alpha transparency</text><text x="180" y="360" text-anchor="middle" font-size="16" fill="#4a4a63">No timing</text></g>
<g><rect x="340" y="80" width="280" height="300" rx="16" fill="#fff" stroke="#d8d5ef" stroke-width="2"/><rect x="395" y="124" width="110" height="86" rx="10" fill="#a39af8"/><rect x="420" y="112" width="110" height="86" rx="10" fill="#7d70f5"/><rect x="445" y="100" width="110" height="86" rx="10" fill="#5b4cf0"/><circle cx="500" cy="143" r="24" fill="#fff"/><text x="480" y="252" text-anchor="middle" font-size="20" font-weight="700" fill="#1b1b2f">APNG</text><text x="480" y="282" text-anchor="middle" font-size="16" fill="#4a4a63">Many frames</text><text x="480" y="308" text-anchor="middle" font-size="16" fill="#4a4a63">Full colour</text><text x="480" y="334" text-anchor="middle" font-size="16" fill="#4a4a63">Soft alpha transparency</text><text x="480" y="360" text-anchor="middle" font-size="16" fill="#4a4a63">Timing per frame</text></g>
<g><rect x="640" y="80" width="280" height="300" rx="16" fill="#fff" stroke="#d8d5ef" stroke-width="2"/><rect x="695" y="124" width="110" height="86" rx="10" fill="#c9c5e8"/><rect x="720" y="112" width="110" height="86" rx="10" fill="#a39af8"/><rect x="745" y="100" width="110" height="86" rx="10" fill="#5b4cf0"/><circle cx="800" cy="143" r="24" fill="#fff"/><text x="780" y="252" text-anchor="middle" font-size="20" font-weight="700" fill="#1b1b2f">GIF</text><text x="780" y="282" text-anchor="middle" font-size="16" fill="#4a4a63">Many frames</text><text x="780" y="308" text-anchor="middle" font-size="16" fill="#4a4a63">Max 256 colours / frame</text><text x="780" y="334" text-anchor="middle" font-size="16" fill="#4a4a63">On / off transparency</text><text x="780" y="360" text-anchor="middle" font-size="16" fill="#4a4a63">Delay per frame</text></g>
</g>
<text x="40" y="428" font-family="sans-serif" font-size="17" fill="#4a4a63">APNG keeps PNG colour and transparency. GIF trades them for the widest support.</text></svg>
