<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">Encoded delays versus observed playback</title><desc id="d">A frame encoded with a 10 millisecond delay is typically observed at about 100 milliseconds, while a frame encoded at 20 milliseconds is observed at 20 milliseconds.</desc>
<rect width="960" height="360" rx="24" fill="#f6f6fb"/>
<text x="40" y="56" font-family="sans-serif" font-size="24" font-weight="700" fill="#1b1b2f">Encoded delay vs. what viewers actually play</text>
<text x="40" y="104" font-family="sans-serif" font-size="18" fill="#4a4a63">Encoded 10 ms</text>
<rect x="200" y="84" width="80" height="40" rx="8" fill="#5b4cf0"/>
<text x="40" y="160" font-family="sans-serif" font-size="18" fill="#4a4a63">Observed ≈ 100 ms</text>
<rect x="200" y="140" width="700" height="40" rx="8" fill="#e07856"/>
<text x="40" y="224" font-family="sans-serif" font-size="18" fill="#4a4a63">Encoded 20 ms</text>
<rect x="200" y="204" width="160" height="40" rx="8" fill="#5b4cf0"/>
<text x="40" y="280" font-family="sans-serif" font-size="18" fill="#4a4a63">Observed 20 ms</text>
<rect x="200" y="260" width="160" height="40" rx="8" fill="#7d70f5"/>
<text x="40" y="330" font-family="sans-serif" font-size="17" fill="#4a4a63">Delays under 20 ms get slowed down; 20 ms and above play as written.</text>
</svg>
