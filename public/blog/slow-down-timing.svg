<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="t d"><title id="t">Slowing a GIF by doubling frame delays</title><desc id="d">Original: 8 frames at 100 milliseconds each last 0.8 seconds. Slowed to half speed: the same 8 frames at 200 milliseconds each last 1.6 seconds.</desc>
<rect width="960" height="380" rx="24" fill="#f6f6fb"/>
<text x="40" y="54" font-family="sans-serif" font-size="24" font-weight="700" fill="#1b1b2f">Original: 8 frames × 100 ms = 0.8 s per loop</text>
<g font-family="sans-serif" font-size="16" fill="#fff" text-anchor="middle">
<rect x="40" y="78" width="100" height="56" rx="10" fill="#5b4cf0"/><text x="90" y="113">1</text>
<rect x="148" y="78" width="100" height="56" rx="10" fill="#5b4cf0"/><text x="198" y="113">2</text>
<rect x="256" y="78" width="100" height="56" rx="10" fill="#5b4cf0"/><text x="306" y="113">3</text>
<rect x="364" y="78" width="100" height="56" rx="10" fill="#5b4cf0"/><text x="414" y="113">4</text>
<rect x="472" y="78" width="100" height="56" rx="10" fill="#5b4cf0"/><text x="522" y="113">5</text>
<rect x="580" y="78" width="100" height="56" rx="10" fill="#5b4cf0"/><text x="630" y="113">6</text>
<rect x="688" y="78" width="100" height="56" rx="10" fill="#5b4cf0"/><text x="738" y="113">7</text>
<rect x="796" y="78" width="100" height="56" rx="10" fill="#5b4cf0"/><text x="846" y="113">8</text>
</g>
<text x="40" y="196" font-family="sans-serif" font-size="24" font-weight="700" fill="#1b1b2f">Slowed to 0.5×: same 8 frames × 200 ms = 1.6 s per loop</text>
<g font-family="sans-serif" font-size="16" fill="#fff" text-anchor="middle">
<rect x="40" y="220" width="105" height="56" rx="10" fill="#7d70f5"/><text x="92" y="255">1</text>
<rect x="149" y="220" width="105" height="56" rx="10" fill="#7d70f5"/><text x="201" y="255">2</text>
<rect x="258" y="220" width="105" height="56" rx="10" fill="#7d70f5"/><text x="310" y="255">3</text>
<rect x="367" y="220" width="105" height="56" rx="10" fill="#7d70f5"/><text x="419" y="255">4</text>
<rect x="476" y="220" width="105" height="56" rx="10" fill="#7d70f5"/><text x="528" y="255">5</text>
<rect x="585" y="220" width="105" height="56" rx="10" fill="#7d70f5"/><text x="637" y="255">6</text>
<rect x="694" y="220" width="105" height="56" rx="10" fill="#7d70f5"/><text x="746" y="255">7</text>
<rect x="803" y="220" width="105" height="56" rx="10" fill="#7d70f5"/><text x="855" y="255">8</text>
</g>
<text x="40" y="332" font-family="sans-serif" font-size="17" fill="#4a4a63">Same frames, same order, twice the time. Nothing is added or removed.</text>
</svg>
