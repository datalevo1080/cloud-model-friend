<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">One GIF cycle versus repeated loops</title><desc id="d">A three-second cycle of 60 frames is stored once; looping replays the same frames, so playback time grows while stored frames stay at 60.</desc>
<rect width="960" height="360" rx="24" fill="#f6f6fb"/>
<text x="40" y="56" font-family="sans-serif" font-size="24" font-weight="700" fill="#1b1b2f">Stored once: one 3-second cycle (60 frames)</text>
<g fill="#5b4cf0"><rect x="40" y="80" width="280" height="56" rx="10"/></g>
<text x="180" y="115" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff">Cycle · 0 → 3 s</text>
<text x="40" y="200" font-family="sans-serif" font-size="24" font-weight="700" fill="#1b1b2f">Played back: the same cycle repeated</text>
<g font-family="sans-serif" font-size="16" fill="#fff" text-anchor="middle">
<rect x="40" y="224" width="280" height="56" rx="10" fill="#5b4cf0"/><text x="180" y="258">Loop 1 · 0–3 s</text>
<rect x="330" y="224" width="280" height="56" rx="10" fill="#7d70f5"/><text x="470" y="258">Loop 2 · 3–6 s</text>
<rect x="620" y="224" width="280" height="56" rx="10" fill="#a39af8"/><text x="760" y="258">Loop 3 · 6–9 s …</text></g>
<text x="40" y="324" font-family="sans-serif" font-size="17" fill="#4a4a63">Looping adds viewing time, not stored frames. File size depends on the 60 stored frames.</text></svg>
