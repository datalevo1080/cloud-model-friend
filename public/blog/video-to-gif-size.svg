<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">What makes a GIF from video large</title><desc id="d">Three levers multiply: longer duration, larger dimensions, and higher frame rate each increase the amount of frame data in the GIF. Trimming one lever shrinks the file before quality settings are needed.</desc>
<rect width="960" height="460" rx="24" fill="#f6f6fb"/>
<text x="40" y="52" font-family="sans-serif" font-size="24" font-weight="700" fill="#1b1b2f">Three levers, and they multiply</text>
<g font-family="sans-serif">
<g><rect x="40" y="80" width="260" height="150" rx="12" fill="#5b4cf0"/><text x="170" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Duration</text><text x="170" y="162" text-anchor="middle" font-size="16" fill="#e6e2ff">More seconds,</text><text x="170" y="186" text-anchor="middle" font-size="16" fill="#e6e2ff">more frames</text></g>
<text x="320" y="160" text-anchor="middle" font-size="26" fill="#4a4a63">×</text>
<g><rect x="340" y="80" width="260" height="150" rx="12" fill="#7d70f5"/><text x="470" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Dimensions</text><text x="470" y="162" text-anchor="middle" font-size="16" fill="#e6e2ff">More pixels</text><text x="470" y="186" text-anchor="middle" font-size="16" fill="#e6e2ff">per frame</text></g>
<text x="620" y="160" text-anchor="middle" font-size="26" fill="#4a4a63">×</text>
<g><rect x="640" y="80" width="260" height="150" rx="12" fill="#a39af8"/><text x="770" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Frame rate</text><text x="770" y="162" text-anchor="middle" font-size="16" fill="#e6e2ff">More frames</text><text x="770" y="186" text-anchor="middle" font-size="16" fill="#e6e2ff">per second</text></g>
<text x="40" y="290" font-size="19" fill="#4a4a63">Halving any one lever roughly halves the frame data. Halving two quarters it.</text>
<text x="40" y="330" font-size="19" fill="#4a4a63">Example: 4 seconds at 10 frames per second is 40 frames. At 20 frames per second it is 80.</text>
<text x="40" y="370" font-size="19" fill="#4a4a63">Trim first, resize second, compress last.</text>
</g></svg>
