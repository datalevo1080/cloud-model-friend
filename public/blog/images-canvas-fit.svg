<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">The first image sets the canvas</title><desc id="d">The first image sets the output width and height. Later images are fitted inside that canvas, centred, and never stretched, with transparent padding filling the leftover space.</desc>
<rect width="960" height="420" rx="24" fill="#f6f6fb"/>
<text x="40" y="52" font-family="sans-serif" font-size="24" font-weight="700" fill="#1b1b2f">The first image sets the canvas size</text>
<g font-family="sans-serif">
<rect x="40" y="80" width="400" height="240" rx="12" fill="#5b4cf0"/>
<text x="240" y="120" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">First image: 800 × 600</text>
<text x="240" y="150" text-anchor="middle" font-size="16" fill="#e6e2ff">This becomes the GIF size</text>
<rect x="520" y="80" width="400" height="240" rx="12" fill="#fff" stroke="#d8d5ef" stroke-width="2"/>
<rect x="600" y="110" width="240" height="180" rx="8" fill="#a39af8"/>
<text x="720" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1b2f">Later image: 400 × 300</text>
<text x="720" y="296" text-anchor="middle" font-size="15" fill="#4a4a63">Fitted inside, centred, never stretched</text>
</g>
<text x="40" y="370" font-family="sans-serif" font-size="17" fill="#4a4a63">Leftover space becomes transparent padding. Put your largest or most important image first.</text>
</svg>
