<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="t d"><title id="t">Frame delay and nominal frame rate</title><desc id="d">A delay of 100 milliseconds per frame plays at about 10 frames per second, 200 milliseconds at 5, 500 milliseconds at 2, and 1000 milliseconds at 1. Twelve frames at 100 milliseconds run for 1.2 seconds per loop.</desc>
<rect width="960" height="400" rx="24" fill="#f6f6fb"/>
<text x="40" y="52" font-family="sans-serif" font-size="24" font-weight="700" fill="#1b1b2f">Delay is a duration. Frame rate follows from it.</text>
<g font-family="sans-serif" font-size="17">
<g><rect x="40" y="80" width="200" height="110" rx="12" fill="#5b4cf0"/><text x="140" y="128" text-anchor="middle" font-weight="700" fill="#fff">100 ms delay</text><text x="140" y="160" text-anchor="middle" fill="#e6e2ff">about 10 fps</text></g>
<g><rect x="260" y="80" width="200" height="110" rx="12" fill="#7d70f5"/><text x="360" y="128" text-anchor="middle" font-weight="700" fill="#fff">200 ms delay</text><text x="360" y="160" text-anchor="middle" fill="#e6e2ff">about 5 fps</text></g>
<g><rect x="480" y="80" width="200" height="110" rx="12" fill="#a39af8"/><text x="580" y="128" text-anchor="middle" font-weight="700" fill="#1b1b2f">500 ms delay</text><text x="580" y="160" text-anchor="middle" fill="#1b1b2f">about 2 fps</text></g>
<g><rect x="700" y="80" width="220" height="110" rx="12" fill="#fff" stroke="#d8d5ef" stroke-width="2"/><text x="810" y="128" text-anchor="middle" font-weight="700" fill="#1b1b2f">1000 ms delay</text><text x="810" y="160" text-anchor="middle" fill="#4a4a63">about 1 fps</text></g>
</g>
<text x="40" y="250" font-family="sans-serif" font-size="17" fill="#4a4a63">Nominal frames per second = 1000 ÷ delay in milliseconds.</text>
<text x="40" y="290" font-family="sans-serif" font-size="17" fill="#4a4a63">Example: 12 frames at 100 ms each = a 1.2-second loop.</text>
<text x="40" y="330" font-family="sans-serif" font-size="17" fill="#4a4a63">GIF stores delays in hundredths of a second, so odd values round to the nearest 10 ms.</text>
</svg>
