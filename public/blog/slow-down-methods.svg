<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">Three edits compared: scale delays, duplicate frames, delete frames</title><desc id="d">Scaling delays: 8 frames stretched to 1.6 seconds. Duplicating frames: 16 frames at the original delay also reach 1.6 seconds but store more frames. Deleting frames: 4 frames finish in 0.4 seconds, shorter rather than slower.</desc>
<rect width="960" height="460" rx="24" fill="#f6f6fb"/>
<text x="40" y="52" font-family="sans-serif" font-size="22" font-weight="700" fill="#1b1b2f">Scale delays: 8 frames, 1.6 s, same file size</text>
<g fill="#5b4cf0"><rect x="40" y="68" width="105" height="48" rx="10"/><rect x="149" y="68" width="105" height="48" rx="10"/><rect x="258" y="68" width="105" height="48" rx="10"/><rect x="367" y="68" width="105" height="48" rx="10"/><rect x="476" y="68" width="105" height="48" rx="10"/><rect x="585" y="68" width="105" height="48" rx="10"/><rect x="694" y="68" width="105" height="48" rx="10"/><rect x="803" y="68" width="105" height="48" rx="10"/></g>
<text x="40" y="172" font-family="sans-serif" font-size="22" font-weight="700" fill="#1b1b2f">Duplicate frames: 16 frames, 1.6 s, larger file</text>
<g fill="#7d70f5"><rect x="40" y="188" width="52" height="48" rx="8"/><rect x="96" y="188" width="52" height="48" rx="8"/><rect x="152" y="188" width="52" height="48" rx="8"/><rect x="208" y="188" width="52" height="48" rx="8"/><rect x="264" y="188" width="52" height="48" rx="8"/><rect x="320" y="188" width="52" height="48" rx="8"/><rect x="376" y="188" width="52" height="48" rx="8"/><rect x="432" y="188" width="52" height="48" rx="8"/><rect x="488" y="188" width="52" height="48" rx="8"/><rect x="544" y="188" width="52" height="48" rx="8"/><rect x="600" y="188" width="52" height="48" rx="8"/><rect x="656" y="188" width="52" height="48" rx="8"/><rect x="712" y="188" width="52" height="48" rx="8"/><rect x="768" y="188" width="52" height="48" rx="8"/><rect x="824" y="188" width="52" height="48" rx="8"/><rect x="880" y="188" width="28" height="48" rx="8"/></g>
<text x="40" y="292" font-family="sans-serif" font-size="22" font-weight="700" fill="#1b1b2f">Delete frames: 4 frames, 0.4 s — shorter, not slower</text>
<g fill="#a39af8"><rect x="40" y="308" width="105" height="48" rx="10"/><rect x="149" y="308" width="105" height="48" rx="10"/><rect x="258" y="308" width="105" height="48" rx="10"/><rect x="367" y="308" width="105" height="48" rx="10"/></g>
<text x="40" y="412" font-family="sans-serif" font-size="17" fill="#4a4a63">Only the first two slow the animation. Deleting frames removes moments instead.</text>
</svg>
