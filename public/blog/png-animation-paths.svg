<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">Three ways to animate a PNG</title><desc id="d">One static PNG needs new frames created before export. A set of PNG frames needs ordering and timing before export. An APNG needs its frames exported first, or conversion with colour and transparency changes, before it becomes a GIF.</desc>
<rect width="960" height="520" rx="24" fill="#f6f6fb"/>
<text x="40" y="52" font-family="sans-serif" font-size="24" font-weight="700" fill="#1b1b2f">Start from what you already have</text>
<g font-family="sans-serif">
<g><rect x="40" y="80" width="220" height="96" rx="12" fill="#5b4cf0"/><text x="150" y="122" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">1 static PNG</text><text x="150" y="150" text-anchor="middle" font-size="16" fill="#e6e2ff">One still image</text></g>
<text x="292" y="138" text-anchor="middle" font-size="26" fill="#4a4a63">→</text>
<g><rect x="324" y="80" width="340" height="96" rx="12" fill="#fff" stroke="#d8d5ef" stroke-width="2"/><text x="494" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1b2f">Create the motion</text><text x="494" y="150" text-anchor="middle" font-size="16" fill="#4a4a63">New frames: move, scale or fade</text></g>
<text x="696" y="138" text-anchor="middle" font-size="26" fill="#4a4a63">→</text>
<g><rect x="728" y="80" width="192" height="96" rx="12" fill="#1b1b2f"/><text x="824" y="122" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">APNG or GIF</text><text x="824" y="150" text-anchor="middle" font-size="16" fill="#c9c5e8">Export</text></g>
<g><rect x="40" y="208" width="220" height="96" rx="12" fill="#5b4cf0"/><text x="150" y="250" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">PNG frames</text><text x="150" y="278" text-anchor="middle" font-size="16" fill="#e6e2ff">A numbered sequence</text></g>
<text x="292" y="266" text-anchor="middle" font-size="26" fill="#4a4a63">→</text>
<g><rect x="324" y="208" width="340" height="96" rx="12" fill="#fff" stroke="#d8d5ef" stroke-width="2"/><text x="494" y="250" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1b2f">Order + time them</text><text x="494" y="278" text-anchor="middle" font-size="16" fill="#4a4a63">Delay per frame, loop count</text></g>
<text x="696" y="266" text-anchor="middle" font-size="26" fill="#4a4a63">→</text>
<g><rect x="728" y="208" width="192" height="96" rx="12" fill="#1b1b2f"/><text x="824" y="250" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">APNG or GIF</text><text x="824" y="278" text-anchor="middle" font-size="16" fill="#c9c5e8">Export</text></g>
<g><rect x="40" y="336" width="220" height="96" rx="12" fill="#7d70f5"/><text x="150" y="378" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">An APNG</text><text x="150" y="406" text-anchor="middle" font-size="16" fill="#e6e2ff">Already animated</text></g>
<text x="292" y="394" text-anchor="middle" font-size="26" fill="#4a4a63">→</text>
<g><rect x="324" y="336" width="340" height="96" rx="12" fill="#fff" stroke="#d8d5ef" stroke-width="2"/><text x="494" y="378" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1b2f">Export frames, then convert</text><text x="494" y="406" text-anchor="middle" font-size="16" fill="#4a4a63">Colours + transparency change</text></g>
<text x="696" y="394" text-anchor="middle" font-size="26" fill="#4a4a63">→</text>
<g><rect x="728" y="336" width="192" height="96" rx="12" fill="#1b1b2f"/><text x="824" y="378" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">GIF or still PNG</text><text x="824" y="406" text-anchor="middle" font-size="16" fill="#c9c5e8">Result</text></g>
</g>
<text x="40" y="484" font-family="sans-serif" font-size="17" fill="#4a4a63">Renaming a file is not a fourth path: a new extension adds no frames and no timing.</text></svg>
